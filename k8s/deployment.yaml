apiVersion: apps/v1
kind: Deployment
metadata:
  name: fiscal-ecuador-node
  labels:
    app: fiscal-ecuador-node
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fiscal-ecuador-node
  template:
    metadata:
      labels:
        app: fiscal-ecuador-node
    spec:
      containers:
        - name: fiscal-ecuador
          image: ${REGISTRY}/${IMAGE_NAME}:${IMAGE_TAG}
          ports:
            - containerPort: 3010
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3010"
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: fiscal-db
                  key: host
            - name: DB_PORT
              valueFrom:
                secretKeyRef:
                  name: fiscal-db
                  key: port
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: fiscal-db
                  key: user
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fiscal-db
                  key: password
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: fiscal-db
                  key: name
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: fiscal-rabbitmq
                  key: url
            - name: CORS_ORIGIN
              value: "https://steep-geology-napping.ngrok-free.dev"
            - name: DOCUMENT_SERVICE_URL
              value: "http://document-service-node:3007"
            - name: TAX_SERVICE_URL
              value: "http://tax-service-node:3005"
            - name: ORG_SERVICE_URL
              value: "http://organization-service-node:3002"
            - name: INTERNAL_SERVICE_SECRET
              valueFrom:
                secretKeyRef:
                  name: fiscal-db
                  key: internalSecret
            - name: CERTIFICATE_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: fiscal-db
                  key: certMasterKey
            - name: SRI_ENVIRONMENT
              value: "pruebas"
            - name: SRI_RECEPTION_URL
              valueFrom:
                configMapKeyRef:
                  name: fiscal-config
                  key: sriReceptionUrl
                  optional: true
            - name: SRI_AUTHORIZATION_URL
              valueFrom:
                configMapKeyRef:
                  name: fiscal-config
                  key: sriAuthorizationUrl
                  optional: true
            - name: JWT_PUBLIC_KEY_PATH
              value: "certs/public.pem"
            - name: OTEL_SERVICE_NAME
              value: "fiscal-ecuador"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector.observability.svc.cluster.local:4318"
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "300m"
          livenessProbe:
            httpGet:
              path: /health
              port: 3010
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 3010
            initialDelaySeconds: 5
            periodSeconds: 10
