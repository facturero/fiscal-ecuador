apiVersion: apps/v1
kind: Deployment
metadata:
  name: fiscal-ecuador-node
  labels:
    app: fiscal-ecuador-node
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fiscal-ecuador-node
  template:
    metadata:
      labels:
        app: fiscal-ecuador-node
    spec:
      initContainers:
        - name: fiscal-migrate
          image: ${REGISTRY}/${IMAGE_NAME}:${IMAGE_TAG}
          securityContext:
            runAsUser: 0
          command:
            - sh
            - -c
            - "npx sequelize-cli db:migrate"
          env:
            - name: NODE_ENV
              value: "production"
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: fiscal-db
                  key: host
            - name: DB_PORT
              valueFrom:
                secretKeyRef:
                  name: fiscal-db
                  key: port
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: fiscal-db
                  key: user
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fiscal-db
                  key: password
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: fiscal-db
                  key: name
      containers:
        - name: fiscal-ecuador
          image: ${REGISTRY}/${IMAGE_NAME}:${IMAGE_TAG}
          ports:
            - containerPort: 3010
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3010"
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: fiscal-db
                  key: host
            - name: DB_PORT
              valueFrom:
                secretKeyRef:
                  name: fiscal-db
                  key: port
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: fiscal-db
                  key: user
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fiscal-db
                  key: password
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: fiscal-db
                  key: name
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: fiscal-rabbitmq
                  key: url
            - name: CORS_ORIGIN
              value: "https://steep-geology-napping.ngrok-free.dev"
            # Nombres reales de los Services del clúster (comprobado el 2026-09-13).
            # Los anteriores (document-service-node:3007, tax-service-node,
            # organization-service-node) no existen: daban ENOTFOUND, así que el
            # servicio nunca pudo bajar un certificado, subir un XML ni leer los
            # catálogos.
            - name: DOCUMENT_SERVICE_URL
              value: "http://document-service:3003"
            - name: TAX_SERVICE_URL
              value: "http://tax-service:3005"
            - name: ORG_SERVICE_URL
              value: "http://organization-service:3002"
            # El mismo secret que billing, auth, organization y document-service.
            # Antes salía de `fiscal-db/internalSecret`, que tenía el valor de
            # desarrollo del repo.
            - name: INTERNAL_SERVICE_SECRET
              valueFrom:
                secretKeyRef:
                  name: internal-service-secret
                  key: value
            - name: CERTIFICATE_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: fiscal-db
                  key: certMasterKey
            # Ambiente del SRI. Sin el ConfigMap `fiscal-config` (hoy no existe) la
            # variable queda vacía y el servicio usa `pruebas`. Para pasar a
            # producción basta con la clave `sriEnvironment: produccion`: las URLs
            # de cel.sri.gob.ec salen solas del ambiente. Las dos claves de URL
            # solo sirven para apuntar a un simulador, y si contradicen el
            # ambiente el servicio se niega a arrancar.
            - name: SRI_ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: fiscal-config
                  key: sriEnvironment
                  optional: true
            - name: SRI_RECEPTION_URL
              valueFrom:
                configMapKeyRef:
                  name: fiscal-config
                  key: sriReceptionUrl
                  optional: true
            - name: SRI_AUTHORIZATION_URL
              valueFrom:
                configMapKeyRef:
                  name: fiscal-config
                  key: sriAuthorizationUrl
                  optional: true
            - name: OTEL_SERVICE_NAME
              value: "fiscal-ecuador"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector.observability.svc.cluster.local:4318"
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            # Sin `limits` a proposito: un tope de CPU de 300m estrangulaba al servicio (throttle)
            # y las pruebas de stress-petitions medían el limite de Kubernetes, no la capacidad
            # del codigo, con el nodo casi ocioso. Se conservan los `requests` (reserva).
          livenessProbe:
            httpGet:
              path: /health
              port: 3010
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 3010
            initialDelaySeconds: 5
            periodSeconds: 10
